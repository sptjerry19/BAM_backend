# Disposable pre-deploy gate. Use only through docker/verify-deploy.sh.
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: jbam_verify
      MYSQL_USER: jbam_verify
      MYSQL_PASSWORD: verify_only
      MYSQL_ROOT_PASSWORD: verify_root_only
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysqladmin ping -h 127.0.0.1 -uroot"]
      interval: 5s
      timeout: 5s
      retries: 20

  mailpit:
    image: axllent/mailpit:latest

  verifier:
    image: jbam-backend-test:verify
    build:
      context: .
      dockerfile: docker/Dockerfile.verify
    entrypoint: ["php"]
    environment:
      APP_ENV: testing
      APP_KEY: base64:nugRhXRzO7LCBYtnyXJletNrpIEnCCvZoRFvg67UhpY=
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: jbam_verify
      DB_USERNAME: jbam_verify
      DB_PASSWORD: verify_only
      CACHE_STORE: array
      CACHE_DRIVER: array
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: array
      SCOUT_DRIVER: "null"
      BROADCAST_CONNECTION: "null"
      MAIL_MAILER: smtp
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      MAILPIT_HOST: mailpit
      MAILPIT_INTEGRATION: "1"
    depends_on:
      mysql:
        condition: service_healthy
      mailpit:
        condition: service_started
