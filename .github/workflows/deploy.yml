name: Deploy Backend to EC2

on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: deploy-backend-ec2
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          # Build + ES/MySQL health + migrate on a 1GB box can exceed the 10m default.
          command_timeout: 30m
          script_stop: true
          script: |
            set -euo pipefail
            cd /home/ubuntu/BAM_backend

            # Repo may have been cloned as root; Git 2.35+ blocks that for ubuntu.
            git config --global --add safe.directory /home/ubuntu/BAM_backend

            echo "==> Pull latest"
            git fetch origin
            DEFAULT_BRANCH="$(git remote show origin | sed -n '/HEAD branch/s/.*: //p')"
            git checkout "$DEFAULT_BRANCH"
            git reset --hard "origin/$DEFAULT_BRANCH"

            echo "==> Ensure swap (1GB box OOM-kills php/migrate with exit 137 without it)"
            if ! swapon --show | grep -q .; then
              if [ ! -f /swapfile ]; then
                sudo fallocate -l 2G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=2048
                sudo chmod 600 /swapfile
                sudo mkswap /swapfile
              fi
              sudo swapon /swapfile || true
              grep -q '/swapfile' /etc/fstab || echo '/swapfile none swap sw 0 0' | sudo tee -a /etc/fstab
            fi
            free -h

            echo "==> Free disk/memory before build"
            docker image prune -f

            echo "==> Build & restart stack (migrate deferred until php-fpm is up)"
            export SKIP_ENTRYPOINT_MIGRATE=true
            docker compose --env-file .env up -d --build --remove-orphans

            echo "==> Wait for php-fpm"
            ready=0
            for i in $(seq 1 24); do
              if docker compose exec -T backend sh -c "pgrep -f php-fpm >/dev/null"; then
                echo "php-fpm ready after ~$((i * 5))s"
                ready=1
                break
              fi
              # Surface crash-loops early instead of waiting for SSH timeout.
              if ! docker compose ps backend --status running -q 2>/dev/null | grep -q .; then
                echo "backend container is not running" >&2
                docker compose ps
                docker compose logs --tail 80 backend || true
                free -h
                sudo dmesg | tail -40 | grep -i -E 'oom|killed' || true
                exit 1
              fi
              sleep 5
            done
            if [ "$ready" != "1" ]; then
              echo "php-fpm not ready after 120s" >&2
              docker compose ps
              docker compose logs --tail 80 backend || true
              free -h
              exit 1
            fi

            echo "==> Migrate"
            for attempt in 1 2 3; do
              if docker compose exec -T backend php artisan migrate --force --no-interaction; then
                break
              fi
              if [ "$attempt" = "3" ]; then
                echo "Migration failed 3x — memory snapshot below" >&2
                free -h
                docker compose ps
                docker compose logs --tail 80 backend || true
                sudo dmesg | tail -40 | grep -i -E 'oom|killed' || true
                exit 1
              fi
              echo "Migrate attempt $attempt failed, retrying in 15s..."
              sleep 15
            done

            echo "==> Prune dangling images"
            docker image prune -f

            echo "==> Status"
            docker compose ps
