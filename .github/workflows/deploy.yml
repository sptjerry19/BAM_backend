name: Deploy Backend to EC2

on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: deploy-backend-ec2
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 30m
          script_stop: false
          script: |
            set -euo pipefail
            cd /home/ubuntu/BAM_backend

            # Repo may have been cloned as root; Git 2.35+ blocks that for ubuntu.
            git config --global --add safe.directory /home/ubuntu/BAM_backend

            echo "==> Pull latest"
            git fetch origin
            DEFAULT_BRANCH="$(git remote show origin | sed -n '/HEAD branch/s/.*: //p')"
            git checkout "$DEFAULT_BRANCH"
            git reset --hard "origin/$DEFAULT_BRANCH"

            echo "==> Ensure swap (needed on ~1GB boxes with Elasticsearch)"
            if ! swapon --show | grep -q .; then
              if [ ! -f /swapfile ]; then
                sudo fallocate -l 2G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=2048
                sudo chmod 600 /swapfile
                sudo mkswap /swapfile
              fi
              sudo swapon /swapfile || true
              grep -q '/swapfile' /etc/fstab || echo '/swapfile none swap sw 0 0' | sudo tee -a /etc/fstab
            fi
            free -h

            echo "==> Lean boot flags (migrate / scout:import are manual)"
            touch .env
            for key in RUN_SCOUT_IMPORT SKIP_ENTRYPOINT_MIGRATE; do
              grep -q "^${key}=" .env || echo "${key}=" >> .env
            done
            sed -i 's/^RUN_SCOUT_IMPORT=.*/RUN_SCOUT_IMPORT=false/' .env
            sed -i 's/^SKIP_ENTRYPOINT_MIGRATE=.*/SKIP_ENTRYPOINT_MIGRATE=true/' .env
            if grep -q '^ES_JAVA_OPTS=' .env; then
              sed -i 's/^ES_JAVA_OPTS=.*/ES_JAVA_OPTS="-Xms256m -Xmx256m"/' .env
            else
              echo 'ES_JAVA_OPTS="-Xms256m -Xmx256m"' >> .env
            fi

            echo "==> Free disk before build"
            docker image prune -f

            echo "==> Build & restart stack"
            export RUN_SCOUT_IMPORT=false
            export SKIP_ENTRYPOINT_MIGRATE=true
            docker compose --env-file .env up -d --build --remove-orphans

            echo "==> Wait for php-fpm"
            ready=0
            for i in $(seq 1 24); do
              if docker compose exec -T backend sh -c "pgrep -f php-fpm >/dev/null"; then
                echo "php-fpm ready after ~$((i * 5))s"
                ready=1
                break
              fi
              if ! docker compose ps backend --status running -q 2>/dev/null | grep -q .; then
                echo "backend container is not running" >&2
                docker compose ps
                docker compose logs --tail 80 backend || true
                free -h
                exit 1
              fi
              sleep 5
            done
            if [ "$ready" != "1" ]; then
              echo "php-fpm not ready after 120s" >&2
              docker compose ps
              docker compose logs --tail 80 backend || true
              free -h
              exit 1
            fi

            echo "==> Prune dangling images"
            docker image prune -f

            echo "==> Status"
            docker compose ps
            free -h
            echo ""
            echo "Manual next steps (when needed):"
            echo "  docker compose exec backend php artisan migrate --force"
            echo "  docker compose exec backend php artisan scout:import \"App\\\\Models\\\\Product\""
