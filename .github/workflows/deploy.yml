name: Deploy Backend to EC2

on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: deploy-backend-ec2
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          script: |
            set -euo pipefail
            cd /home/ubuntu/BAM_backend

            # Repo may have been cloned as root; Git 2.35+ blocks that for ubuntu.
            git config --global --add safe.directory /home/ubuntu/BAM_backend

            echo "==> Pull latest"
            git fetch origin
            DEFAULT_BRANCH="$(git remote show origin | sed -n '/HEAD branch/s/.*: //p')"
            git checkout "$DEFAULT_BRANCH"
            git reset --hard "origin/$DEFAULT_BRANCH"

            echo "==> Build & restart stack"
            docker compose --env-file .env up -d --build --remove-orphans

            echo "==> Migrate"
            docker compose exec -T backend php artisan migrate --force --no-interaction

            echo "==> Prune dangling images"
            docker image prune -f

            echo "==> Status"
            docker compose ps
