name: Backend verification

on:
  workflow_call:
  push:
    paths:
      - 'app/**'
      - 'tests/**'
      - 'routes/**'
      - 'config/**'
      - 'database/migrations/**'
      - 'composer.json'
      - 'composer.lock'
      - 'phpunit.xml'
      - 'docker/**'
      - 'docker-compose.verify.yml'
      - '.github/workflows/test.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'tests/**'
      - 'routes/**'
      - 'config/**'
      - 'database/migrations/**'
      - 'composer.json'
      - 'composer.lock'
      - 'phpunit.xml'
      - 'docker/**'
      - 'docker-compose.verify.yml'
      - '.github/workflows/test.yml'
  workflow_dispatch:

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build, check migrations, and test in Docker
        run: bash docker/verify-deploy.sh
