name: Capital Rivals tests

on:
  push:
    paths:
      - 'app/**'
      - 'tests/**'
      - 'routes/**'
      - 'config/capital_rivals.php'
      - 'database/migrations/*capital_rivals*'
      - 'composer.json'
      - 'composer.lock'
      - 'phpunit.xml'
      - '.github/workflows/test.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'tests/**'
      - 'routes/**'
      - 'config/capital_rivals.php'
      - 'database/migrations/*capital_rivals*'
      - 'composer.json'
      - 'composer.lock'
      - 'phpunit.xml'
      - '.github/workflows/test.yml'
  workflow_dispatch:

jobs:
  phpunit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: jbam_test
          MYSQL_USER: jbam
          MYSQL_PASSWORD: secret
          MYSQL_ROOT_PASSWORD: rootsecret
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -prootsecret"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      APP_ENV: testing
      APP_KEY: base64:nugRhXRzO7LCBYtnyXJletNrpIEnCCvZoRFvg67UhpY=
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: jbam_test
      DB_USERNAME: jbam
      DB_PASSWORD: secret
      CACHE_STORE: array
      CACHE_DRIVER: array
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: array
      SCOUT_DRIVER: "null"
      BROADCAST_CONNECTION: "null"
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql, pdo_sqlite, redis
          coverage: none
      - name: Prepare test environment
        run: cp .env.example .env
      - name: Install Composer deps
        run: composer install --no-interaction --prefer-dist
      - name: Migrate
        run: php artisan migrate --force --no-interaction
      - name: PHPUnit Capital Rivals
        run: php artisan test --filter=CapitalRivals
