services:
  dev-backend:
    image: bam_backend-backend:latest
    entrypoint: ["php-fpm", "-F"]
    env_file: .env
    environment:
      APP_ENV: local
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USERNAME: jbam
      REDIS_HOST: redis
      CACHE_STORE: redis
      CACHE_DRIVER: redis
      LOG_CHANNEL: stderr
    volumes:
      - ./:/var/www/html
    networks:
      - jb_net
    restart: unless-stopped

  dev-api:
    image: nginx:1.27-alpine
    ports:
      - "127.0.0.1:${APP_PORT:-8082}:80"
    volumes:
      - ./docker/nginx/dev-api.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - dev-backend
    networks:
      - jb_net
    restart: unless-stopped

networks:
  jb_net:
    external: true
    name: jb_net
